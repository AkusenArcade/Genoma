[package]
name = "genoma-script"
description = "Genoma's interface language: Luau, with bindings and hot reload"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
calloop = "0.14.5"
genoma-core = { path = "../genoma-core" }
genoma-scene = { path = "../genoma-scene" }
genoma-services = { path = "../genoma-services" }
log.workspace = true
mlua = { version = "0.12", features = ["luau", "serde"] }
rustix = { version = "1.1", features = ["fs", "process", "event", "pipe"] }
serde_json = "1"
