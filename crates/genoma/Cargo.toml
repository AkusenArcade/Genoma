[package]
name = "genoma"
description = "The Genoma shell runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
env_logger.workspace = true
genoma-core = { path = "../genoma-core" }
genoma-render = { path = "../genoma-render" }
genoma-scene = { path = "../genoma-scene" }
genoma-script = { path = "../genoma-script" }
genoma-services = { path = "../genoma-services" }
log.workspace = true
accesskit = "0.25"
accesskit_unix = "0.24"
notify = "8"
smithay-client-toolkit.workspace = true
rustix = { version = "1.1", features = ["termios", "stdio"] }
