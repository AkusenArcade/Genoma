[package]
name = "genoma-services"
description = "Genoma's service objects: one per system domain, each a set of signals"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
calloop = "0.14.5"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
genoma-core = { path = "../genoma-core" }
jiff = "0.2"
libc = "0.2.191"
log.workspace = true
pipewire = "0.10"
serde_json = "1"
zbus = "6"
zruntime = { version = "0.2.1", features = ["helper", "lock"] }
