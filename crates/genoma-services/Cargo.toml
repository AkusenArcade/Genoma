[package]
name = "genoma-services"
description = "Genoma's service objects: one per system domain, each a set of signals"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
calloop = "0.14.5"
fast_image_resize = { version = "6", default-features = false, features = ["std", "image"] }
futures-channel = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
genoma-core = { path = "../genoma-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
jiff = "0.2"
libc = "0.2.191"
log.workspace = true
md-5 = "0.11"
pipewire = "0.10"
resvg = "0.49"
rustfft = "6"
png = "0.18"
rustix = { version = "1.1", features = ["fs", "process"] }
serde_json = "1"
unicode-normalization = "0.1"
zbus = "6"
zruntime = { version = "0.2.1", features = ["helper", "lock"] }
