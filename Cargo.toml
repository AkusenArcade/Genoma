[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
bytemuck = { version = "1", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
pollster = "0.4"
raw-window-handle = "0.6"
smithay-client-toolkit = { version = "0.21.1", features = ["system"] }
glyphon = "0.12"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }

[profile.release]
debug = "line-tables-only"

# taffy 0.15.1 with one fix (vendor/taffy/GENOMA.md): a removed node left in
# a hidden containing block's hoisted list was a panic in the layout's
# rounding pass.
[patch.crates-io]
taffy = { path = "vendor/taffy" }
